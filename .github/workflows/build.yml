name: Build and test

on:
  push:
    branches: [Salman-branch, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'
      - name: Build application
        run: dotnet build GamificationPlatform.csproj --configuration Release
      - name: Check frontend JavaScript syntax
        run: |
          for file in wwwroot/js/*.js; do
            node --check "$file"
          done
      - name: Run Subapp 1 backend unit tests
        run: dotnet test tests/GamificationPlatform.Tests/GamificationPlatform.Tests.csproj --configuration Release
